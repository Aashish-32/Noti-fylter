<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Indigo to Teal Gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle shadow for 3D effect -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- White rounded background -->
  <rect width="512" height="512" fill="white" rx="100" ry="100"/>
  
  <!-- Main Notification Bell with gradient and shadow -->
  <g filter="url(#softShadow)">
    <!-- Bell bowl (upper curved part) -->
    <ellipse cx="256" cy="200" rx="90" ry="100" fill="url(#mainGradient)" stroke="none"/>
    
    <!-- Bell bottom (wider part) -->
    <path d="M 166 200 Q 166 250 190 280 L 322 280 Q 346 250 346 200 Z" 
          fill="url(#mainGradient)" stroke="none"/>
    
    <!-- Bell handle connection -->
    <rect x="220" y="280" width="72" height="20" rx="10" fill="url(#mainGradient)" stroke="none"/>
    
    <!-- Bell clapper (inside, hanging) -->
    <ellipse cx="256" cy="320" rx="12" ry="18" fill="url(#mainGradient)" stroke="none" opacity="0.85"/>
  </g>
  
  <!-- Bell inner highlight for glass/3D effect -->
  <ellipse cx="220" cy="170" rx="70" ry="80" fill="white" opacity="0.2" stroke="none"/>
  
  <!-- Lightning bolt accent (smaller, inside bell) -->
  <g transform="translate(256, 210)">
    <path d="M 0 -20 L -12 -2 L 0 -2 L -18 25 L 0 5 L -8 5 Z" 
          fill="white" stroke="white" stroke-width="0.5" stroke-linejoin="round" opacity="0.9"/>
  </g>
  
  <!-- Notification badge (red dot, top-right) -->
  <g filter="url(#softShadow)">
    <circle cx="350" cy="120" r="28" fill="#ef4444" stroke="white" stroke-width="4"/>
    <!-- Number inside badge -->
    <text x="350" y="130" font-size="32" font-weight="bold" fill="white" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">3</text>
  </g>
  
  <!-- Subtle corner accent light -->
  <ellipse cx="140" cy="140" rx="55" ry="55" fill="white" opacity="0.06" stroke="none"/>
  
  <!-- Subtle animation wave (semi-transparent ring around bell) -->
  <ellipse cx="256" cy="280" rx="110" ry="120" fill="none" stroke="url(#mainGradient)" stroke-width="2" opacity="0.15"/>
</svg>
