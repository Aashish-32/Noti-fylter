<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Indigo to Teal Gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle shadow for 3D effect -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner glow highlight -->
    <filter id="innerLight">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>
  
  <!-- White rounded background -->
  <rect width="512" height="512" fill="white" rx="100" ry="100"/>
  
  <!-- Main Shield with gradient and shadow -->
  <g filter="url(#softShadow)">
    <path d="M 256 90 L 360 145 L 360 260 C 360 350 256 430 256 430 C 256 430 152 350 152 260 L 152 145 Z" 
          fill="url(#mainGradient)" stroke="none"/>
  </g>
  
  <!-- Shield inner highlight (top-left) for glass/3D effect -->
  <path d="M 256 110 L 340 155 L 340 260 C 340 325 256 405 256 405 C 256 405 172 325 172 260 L 172 155 Z" 
        fill="white" opacity="0.18" stroke="none"/>
  
  <!-- Lightning Bolt (centered in shield) -->
  <g transform="translate(256, 220)">
    <path d="M 2 -45 L -18 -8 L -2 -8 L -28 42 L -2 8 L -14 8 Z" 
          fill="white" stroke="white" stroke-width="0.5" stroke-linejoin="round" opacity="0.95"/>
  </g>
  
  <!-- Notification Bell (top-right corner of shield) -->
  <g transform="translate(315, 155)">
    <!-- Bell body -->
    <path d="M -10 -2 C -10 -10 -5 -16 0 -16 C 5 -16 10 -10 10 -2 L 10 8 C 0 8 -10 8 -10 8 Z" 
          fill="white" stroke="none" opacity="0.92"/>
    
    <!-- Bell clapper/tongue -->
    <ellipse cx="0" cy="12" rx="3" ry="4" fill="white" opacity="0.92"/>
    
    <!-- Notification dot (red) -->
    <circle cx="13" cy="-10" r="6" fill="#ef4444" stroke="white" stroke-width="1.5" opacity="0.95"/>
  </g>
  
  <!-- Subtle corner accent light (top-left) -->
  <ellipse cx="140" cy="140" rx="55" ry="55" fill="white" opacity="0.06" stroke="none"/>
  
  <!-- Very subtle texture gradient overlay -->
  <rect width="512" height="512" rx="100" ry="100" 
        fill="url(#mainGradient)" opacity="0.02" stroke="none"/>
</svg>
